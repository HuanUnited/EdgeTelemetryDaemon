name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit, Race & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./...

      - name: Run Benchmarks (Zero Allocation Check)
        run: go test -bench=. -benchmem ./...

      - name: Run Fuzz Smoke Tests
        run: |
          go test -fuzz=FuzzParseCPULine -fuzztime=5s ./internal/collector
          go test -fuzz=FuzzParseMemInfo -fuzztime=5s ./internal/collector
          go test -fuzz=FuzzWelfordEquivalence -fuzztime=5s ./internal/engine
          go test -fuzz=FuzzSuppressorProcess -fuzztime=5s ./internal/filter

  docker:
    name: Container Build & Compose Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Validate Compose Stack Launch
        run: |
          docker compose up -d --build
          sleep 5
          docker compose ps
          curl -f http://localhost:8080/healthz
          curl -f http://localhost:8080/metrics
          docker compose down